name: Connector Heartbeat Verification

on:
  pull_request:
    paths:
      - '.github/workflows/connector-heartbeat-verification.yml'
      - 'connector/**'
      - 'lib/supabase.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/test-heartbeat-database.ps1'
      - 'supabase/**'
  push:
    branches:
      - feature/machine-wide-connector-service
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '20.20.2'
  DENO_VERSION: 'v2.9.2'
  SUPABASE_CLI_VERSION: '2.109.1'
  LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-local-public-anon-key
  NO_COLOR: '1'

jobs:
  heartbeat-edge-function-tests:
    name: heartbeat-edge-function-tests
    runs-on: ubuntu-latest
    steps:
      # Official GitHub checkout action, pinned to an immutable commit SHA.
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Official Deno setup action from denoland, pinned to an immutable commit SHA.
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Report Deno version
        run: deno --version

      - name: Check heartbeat Edge Function
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/deno
          deno check --node-modules-dir=none \
            supabase/functions/report-pos-connector-heartbeat/index.ts \
            supabase/functions/report-pos-connector-heartbeat/handler.ts \
            supabase/functions/report-pos-connector-heartbeat/index.test.ts \
            supabase/functions/_shared/connector-auth.test.ts \
            supabase/functions/claim-pos-publish-job/index.test.ts \
            supabase/functions/report-pos-publish-job-status/index.test.ts \
            2>&1 | tee ci-artifacts/deno/deno-check.log

      - name: Run heartbeat Edge Function tests
        run: |
          set -euo pipefail
          deno test \
            --node-modules-dir=none \
            --allow-env \
            supabase/functions/report-pos-connector-heartbeat/index.test.ts \
            supabase/functions/_shared/connector-auth.test.ts \
            supabase/functions/claim-pos-publish-job/index.test.ts \
            supabase/functions/report-pos-publish-job-status/index.test.ts \
            2>&1 | tee ci-artifacts/deno/deno-test.log

      - name: Require executable Deno coverage
        run: |
          set -euo pipefail
          perl -pe 's/\e\[[0-9;]*m//g' ci-artifacts/deno/deno-test.log > ci-artifacts/deno/deno-test.clean.log
          if ! grep -Eq "ok \\| ([5-9][5-9]|[6-9][0-9]|[1-9][0-9]{2,}) passed \\| 0 failed" ci-artifacts/deno/deno-test.clean.log; then
            echo "Expected at least 55 passing Deno tests with zero failures."
            exit 1
          fi
          if grep -Eiq "ignored|filtered out" ci-artifacts/deno/deno-test.clean.log; then
            echo "Deno tests must not be ignored or filtered."
            exit 1
          fi

      # Official GitHub artifact action, pinned to an immutable commit SHA.
      - name: Upload Deno logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heartbeat-deno-logs
          path: ci-artifacts/deno
          if-no-files-found: ignore

  heartbeat-database-tests:
    name: heartbeat-database-tests
    runs-on: ubuntu-latest
    steps:
      # Official GitHub checkout action, pinned to an immutable commit SHA.
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Official Supabase CLI setup action, pinned to an immutable commit SHA.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Install local PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Discover Supabase CLI syntax
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/database
          {
            supabase --version
            supabase start --help
            supabase test db --help
            supabase db reset --help
            supabase db lint --help
          } 2>&1 | tee ci-artifacts/database/supabase-cli-help.log

      - name: Verify migration filename uniqueness
        run: |
          set -euo pipefail
          node scripts/test-supabase-migration-uniqueness.mjs

      - name: Start local Supabase
        run: |
          set -euo pipefail
          set +e
          supabase start > /tmp/storepulse-supabase-start.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "supabase start failed; showing sanitized diagnostics."
            sed -E \
              -e 's/(anon key|service_role key|JWT secret|API key|DB URL|DATABASE_URL)([^[:alnum:]]+).*/\1\2[REDACTED]/Ig' \
              -e 's/(eyJ[[:alnum:]_.-]+)/[REDACTED_JWT]/g' \
              -e 's#(postgresql?://)[^[:space:]]+#\1[REDACTED]#g' \
              /tmp/storepulse-supabase-start.log
            exit "$status"
          fi

      - name: Apply migrations on clean local database
        run: |
          set -euo pipefail
          supabase db reset --local 2>&1 | tee ci-artifacts/database/db-reset-initial.log

      - name: Run heartbeat SQL regression
        run: |
          set -euo pipefail
          psql "$LOCAL_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/connector_heartbeat_status.sql \
            2>&1 | tee ci-artifacts/database/connector-heartbeat-status.log

      - name: Run local database lint
        run: |
          set -euo pipefail
          supabase db lint --local --schema public,auth --level warning --fail-on error \
            2>&1 | tee ci-artifacts/database/db-lint.log

      - name: Verify reset and reapply path
        run: |
          set -euo pipefail
          supabase db reset --local 2>&1 | tee ci-artifacts/database/db-reset-reapply.log
          psql "$LOCAL_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/connector_heartbeat_status.sql \
            2>&1 | tee ci-artifacts/database/connector-heartbeat-status-after-reset.log

      - name: Simulate repaired history dry run locally
        run: |
          set -euo pipefail
          pending_versions=(
            20260714093000
            20260715170000
            20260715232534
            20260716010554
            20260716051950
            20260716162947
            20260716180000
          )
          supabase migration repair --local --status reverted "${pending_versions[@]}" \
            2>&1 | tee ci-artifacts/database/migration-history-simulation-revert.log
          supabase db push --db-url "$LOCAL_DB_URL" --dry-run --include-all \
            2>&1 | tee ci-artifacts/database/migration-history-simulation-dry-run.log
          for version in "${pending_versions[@]}"; do
            grep -Fq "$version" ci-artifacts/database/migration-history-simulation-dry-run.log
          done
          if grep -Eq '20260619|20260623|20260629|20260630|20260708|20260709|202607110|202607111|202607120|202607121|202607122' ci-artifacts/database/migration-history-simulation-dry-run.log; then
            echo "Unexpected legacy migration appeared in the simulated dry run."
            exit 1
          fi
          supabase migration repair --local --status applied "${pending_versions[@]}" \
            2>&1 | tee ci-artifacts/database/migration-history-simulation-restore.log

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

      # Official GitHub artifact action, pinned to an immutable commit SHA.
      - name: Upload database logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heartbeat-database-logs
          path: ci-artifacts/database
          if-no-files-found: ignore

  application-build:
    name: application-build
    runs-on: ubuntu-latest
    steps:
      # Official GitHub checkout action, pinned to an immutable commit SHA.
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Official GitHub Node setup action, pinned to an immutable commit SHA.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check diff whitespace
        run: git diff --check

  windows-connector-regressions:
    name: windows-connector-regressions
    runs-on: windows-latest
    steps:
      # Official GitHub checkout action, pinned to an immutable commit SHA.
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Official GitHub Node setup action, pinned to an immutable commit SHA.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Provision pinned private Node runtime for connector tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'connector\service\node-runtime-manifest.json'
          $runtimeDirectory = Join-Path $env:GITHUB_WORKSPACE 'connector\runtime\node'
          $runtimePath = Join-Path $runtimeDirectory 'node.exe'

          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "runtime_manifest_missing: $manifestPath"
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:NODE_VERSION) {
            throw "runtime_version_pin_invalid: manifest=$($manifest.version) workflow=$env:NODE_VERSION"
          }
          if ($manifest.required_node_major -ne 20 -or $manifest.architecture -ne 'x64') {
            throw "runtime_manifest_platform_invalid: major=$($manifest.required_node_major) architecture=$($manifest.architecture)"
          }
          if ($manifest.expected_relative_path -ne 'runtime\node' -or $manifest.executable_name -ne 'node.exe') {
            throw 'runtime_manifest_path_invalid'
          }

          $setupNodePath = (Get-Command node.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $setupVersion = (& $setupNodePath --version).Trim()
          $setupArchitecture = (& $setupNodePath -p 'process.arch').Trim()
          if ($setupVersion -ne "v$($manifest.version)" -or $setupArchitecture -ne $manifest.architecture) {
            throw "setup_node_invalid: version=$setupVersion architecture=$setupArchitecture"
          }

          New-Item -ItemType Directory -Path $runtimeDirectory -Force | Out-Null
          Copy-Item -LiteralPath $setupNodePath -Destination $runtimePath -Force

          $runtimeVersion = (& $runtimePath --version).Trim()
          $runtimeArchitecture = (& $runtimePath -p 'process.arch').Trim()
          $runtimeHash = (Get-FileHash -LiteralPath $runtimePath -Algorithm SHA256).Hash.ToUpperInvariant()
          $expectedHash = ([string]$manifest.sha256).ToUpperInvariant()
          if ($runtimeVersion -ne "v$($manifest.version)" -or $runtimeArchitecture -ne $manifest.architecture -or $runtimeHash -ne $expectedHash) {
            throw "runtime_validation_failed: path=$runtimePath version=$runtimeVersion architecture=$runtimeArchitecture sha256=$runtimeHash"
          }

      - name: Provision declared connector Node dependencies for connector tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) {
            throw "npm_ci_failed: exit_code=$LASTEXITCODE"
          }

          $connectorRoot = Join-Path $env:GITHUB_WORKSPACE 'connector'
          $manifestPath = Join-Path $connectorRoot 'service\install-manifest.json'
          $dependencyHelperPath = Join-Path $connectorRoot 'service\storepulse-runtime-node-dependencies.ps1'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf) -or -not (Test-Path -LiteralPath $dependencyHelperPath -PathType Leaf)) {
            throw 'runtime_dependency_source_missing'
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          . $dependencyHelperPath
          Test-StorePulseRuntimeNodeDependencies -Manifest $manifest -Root $env:GITHUB_WORKSPACE | Out-Null
          Copy-StorePulseRuntimeNodeDependencies -Manifest $manifest -SourceRoot $env:GITHUB_WORKSPACE -InstallRoot $connectorRoot | Out-Null
          Test-StorePulseRuntimeNodeDependencies -Manifest $manifest -Root $connectorRoot | Out-Null

      - name: Provision pinned WinSW wrapper for connector tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $connectorRoot = Join-Path $env:GITHUB_WORKSPACE 'connector'
          $manifestPath = Join-Path $connectorRoot 'service\winsw-manifest.json'
          $installManifestPath = Join-Path $connectorRoot 'service\install-manifest.json'
          $wrapperPath = Join-Path $connectorRoot 'service\host\StorePulseConnector.exe'
          $downloadPath = Join-Path $env:RUNNER_TEMP ('storepulse-winsw-' + [guid]::NewGuid().ToString('N') + '.exe')

          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf) -or -not (Test-Path -LiteralPath $installManifestPath -PathType Leaf)) {
            throw 'winsw_manifest_missing'
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $installManifest = Get-Content -LiteralPath $installManifestPath -Raw | ConvertFrom-Json
          foreach ($name in @('name', 'version', 'asset_name', 'download_url', 'sha256', 'architecture', 'installed_relative_path', 'expected_hosts')) {
            if (-not $manifest.PSObject.Properties[$name] -or [string]::IsNullOrWhiteSpace([string]$manifest.$name)) {
              throw 'winsw_manifest_invalid'
            }
          }
          if ($manifest.name -ne 'WinSW' -or $manifest.version -notmatch '^\d+(?:\.\d+){2}$' -or $manifest.architecture -ne 'x64' -or $manifest.sha256 -notmatch '^[A-Fa-f0-9]{64}$') {
            throw 'winsw_manifest_invalid'
          }
          try {
            $uri = [uri][string]$manifest.download_url
          }
          catch {
            throw 'winsw_manifest_invalid'
          }
          $expectedHosts = @($manifest.expected_hosts | ForEach-Object { [string]$_ })
          if ($uri.Scheme -ne 'https' -or [string]::IsNullOrWhiteSpace($uri.Host) -or $expectedHosts -notcontains $uri.Host) {
            throw 'winsw_manifest_host_invalid'
          }
          $relativePath = ([string]$manifest.installed_relative_path).Replace('/', '\\')
          if ([IO.Path]::IsPathRooted($relativePath) -or $relativePath.Contains('..') -or $relativePath -notmatch '^service\\host\\[^\\]+\.exe$' -or $relativePath -ne [string]$installManifest.winsw_runtime_relative_path) {
            throw 'winsw_manifest_path_invalid'
          }
          if ($wrapperPath -ne (Join-Path $connectorRoot $relativePath)) {
            throw 'winsw_wrapper_path_invalid'
          }

          try {
            try {
              Invoke-WebRequest -Uri $uri.AbsoluteUri -OutFile $downloadPath -UseBasicParsing -ErrorAction Stop
            }
            catch {
              throw 'winsw_download_failed'
            }
            $expectedHash = ([string]$manifest.sha256).ToUpperInvariant()
            $downloadHash = (Get-FileHash -LiteralPath $downloadPath -Algorithm SHA256).Hash.ToUpperInvariant()
            if ($downloadHash -ne $expectedHash) {
              throw 'winsw_hash_mismatch'
            }

            New-Item -ItemType Directory -Path (Split-Path -Parent $wrapperPath) -Force | Out-Null
            Copy-Item -LiteralPath $downloadPath -Destination $wrapperPath -Force
            $wrapperHash = (Get-FileHash -LiteralPath $wrapperPath -Algorithm SHA256).Hash.ToUpperInvariant()
            if ($wrapperHash -ne $expectedHash) {
              throw 'winsw_wrapper_hash_mismatch'
            }

            . (Join-Path $connectorRoot 'service\storepulse-windows-service.ps1')
            Test-StorePulseWinSWBinary -InstallRoot $connectorRoot -ManifestPath $manifestPath | Out-Null
          }
          finally {
            Remove-Item -LiteralPath $downloadPath -Force -ErrorAction SilentlyContinue
          }

      - name: Parse connector PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem connector -Filter *.ps1 -Recurse | ForEach-Object FullName
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              Write-Host "ERROR $file"
              $errors | ForEach-Object { Write-Host $_.Message }
              throw "PowerShell parser validation failed."
            }
          }

      - name: Run Verifone runtime tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\connector\tests\test-machine-wide-verifone-runtime.ps1

      - name: Run Current Shift worker tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\connector\tests\test-machine-wide-current-shift-worker.ps1

      - name: Run machine-wide connector service tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\connector\tests\test-machine-wide-connector-service.ps1

      - name: Run finalized business-day tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\connector\tests\test-finalized-business-day-phase2.ps1

      - name: Run explicit business-date tests
        shell: powershell
        run: |
          $fixtureRoot = Join-Path $env:USERPROFILE "StorePulse-Fixtures\business-date"
          $requiredFiles = @(
            "day-733-source.xml",
            "day-733-normalized.json",
            "day-733-reconciliation.json",
            "day-734-source.xml",
            "day-734-normalized.json",
            "day-734-reconciliation.json",
            "storepulse-normalize-transactions.ps1",
            "README.txt",
            "manifest.csv"
          )
          $missing = @($requiredFiles | Where-Object { -not (Test-Path -LiteralPath (Join-Path $fixtureRoot $_)) })
          if ($missing.Count -gt 0) {
            Write-Host "::warning::Skipping fixture-backed explicit business-date regression because the fixture bundle is not present in the clean GitHub runner checkout."
            Write-Host "Missing fixture count: $($missing.Count)"
            exit 0
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\connector\tests\test-explicit-business-date.ps1 -FixtureRoot $fixtureRoot
